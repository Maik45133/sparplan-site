# Woechentlicher Lauf: virtuelles Depot und Score-Register.
#
# Laeuft auf GitHub, nicht auf Maiks Mac: beide Arbeitsumgebungen dort
# erreichen keine Kursquelle, die Actions-Runner haben offenes Netz.
# Oeffentliche Repos haben unbegrenzte Actions-Minuten, und in diesem Lauf
# steckt kein Sprachmodell. Er kostet also weder Geld noch Claude-Credits.
name: Wochenlauf

on:
  schedule:
    # Sonntags 17:30 UTC, also 19:30 deutscher Sommerzeit. Cron in Actions
    # laeuft immer in UTC und kann sich um einige Minuten verspaeten.
    - cron: "30 17 * * 0"
  workflow_dispatch:        # Knopf "Run workflow" fuer sofort

permissions:
  contents: write           # schreibt die beiden Datendateien zurueck
  issues: write             # schliesst die eingelesenen Issues

concurrency:
  group: wochenlauf
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yfinance ist die erste Kursquelle, Stooq der Rueckfall im Code selbst.
      # Faellt die Installation aus, laeuft der Job trotzdem weiter.
      - name: Abhaengigkeiten
        run: pip install --quiet yfinance

      - name: Selbsttests
        run: |
          python tools/tests/test_virtuell.py
          python tools/tests/test_register.py

      # Erst das Register, dann das Depot: beide holen Kurse, und das Register
      # braucht ohnehin die breitere Symbolliste.
      - name: Score-Register
        run: python tools/register.py

      - name: Virtuelles Depot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/virtuell.py

      - name: Zurueckschreiben
        run: |
          # Erst vormerken, dann gegen den Index pruefen: git diff allein
          # uebersieht eine Datei, die es vorher noch nicht gab.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/virtual_portfolio.json data/score_register.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
            exit 0
          fi
          git commit -m "Wochenlauf: Depot und Score-Register aktualisiert"
          git push
