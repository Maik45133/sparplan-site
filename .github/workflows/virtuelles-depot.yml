# Woechentlicher Lauf fuer das virtuelle Depot.
#
# Laeuft auf GitHub, nicht auf Maiks Mac: beide Arbeitsumgebungen dort
# erreichen keine Kursquelle, die Actions-Runner haben offenes Netz.
# Oeffentliche Repos haben unbegrenzte Actions-Minuten, und in diesem Lauf
# steckt kein Sprachmodell. Er kostet also weder Geld noch Claude-Credits.
name: Virtuelles Depot

on:
  schedule:
    # Sonntags 17:30 UTC, also 19:30 deutscher Sommerzeit. Cron in Actions
    # laeuft immer in UTC und kann sich um einige Minuten verspaeten.
    - cron: "30 17 * * 0"
  workflow_dispatch:        # Knopf "Run workflow" fuer sofort

permissions:
  contents: write           # schreibt data/virtual_portfolio.json zurueck
  issues: write             # schliesst die eingelesenen Issues

concurrency:
  group: virtuelles-depot
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yfinance ist die erste Kursquelle, Stooq der Rueckfall im Skript
      # selbst. Faellt die Installation aus, laeuft das Skript trotzdem
      # weiter und nimmt Stooq.
      - name: Abhaengigkeiten
        run: pip install --quiet yfinance || true

      - name: Lauf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/virtuell.py

      - name: Zurueckschreiben
        run: |
          if git diff --quiet -- data/virtual_portfolio.json; then
            echo "Keine Aenderung."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/virtual_portfolio.json
          git commit -m "Virtuelles Depot aktualisiert"
          git push
