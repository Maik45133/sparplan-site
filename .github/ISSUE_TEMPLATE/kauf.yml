name: Titel von Hand aufnehmen
description: Eine Aktie ins virtuelle Depot legen, die nicht aus dem Screening kommt.
title: "TICKER"
labels: ["kauf"]
body:
  - type: markdown
    attributes:
      value: |
        Titel auf den Ticker aendern. Einsatz 1.000 Euro abzueglich Kosten,
        wie bei jeder anderen Position.
  - type: input
    id: datum
    attributes:
      label: Einstandsdatum
      description: Nur wenn nicht heute. Format JJJJ-MM-TT, hoechstens 30 Tage zurueck.
      placeholder: 2026-09-11
    validations:
      required: false
  - type: textarea
    id: notiz
    attributes:
      label: Warum
      description: Der Grund. Ohne den ist spaeter nicht pruefbar, ob er noch gilt.
    validations:
      required: false
