name: Titel von Hand aufnehmen
description: Eine Aktie ins virtuelle Depot legen, die nicht aus dem Screening kommt.
title: "TICKER"
labels: ["kauf"]
body:
  - type: markdown
    attributes:
      value: |
        Titel auf den Ticker aendern. Einstand ist der Schlusskurs des
        Tages, an dem dieses Issue entsteht, Einsatz 1.000 Euro wie bei
        jeder anderen Position.
  - type: textarea
    id: notiz
    attributes:
      label: Warum
      description: Der Grund. Ohne den ist spaeter nicht pruefbar, ob er noch gilt.
    validations:
      required: false
